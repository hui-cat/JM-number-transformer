<button class="theme-toggle-btn" id="themeToggleBtn" title="切换亮色主题 / Switch to light">🌙</button>
</div>

<div class="format-dropdown" id="formatDropdown">

<h3 class="info-modal-title">使用说明</h3>
<div class="info-modal-body">
<p><strong>功能</strong></p>
<p>在上方小文本框中输入数字，选择一种文本格式，点击「确认」按钮（或按 <strong>Ctrl+Enter</strong>），数字会被随机拆分成组并按顺序插入到所选格式模板中，结果输出到大文本框。</p>
<p><strong>快捷键</strong></p>
<p>在任何位置按 <strong>Ctrl+Enter</strong> 即可快速触发转换，无需手动点击按钮。</p>
<p><strong>格式预览</strong></p>
<p>选择格式后，大文本框中会以灰色斜体文字显示该格式的模板预览，方便您了解数字插入位置。</p>
</div>
<div class="info-modal-footer">
<button class="info-modal-btn" id="infoModalCloseBtn">知道了</button>
</div>
</div>
</div>
